<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniDemo — Campus Virtual</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body>
    <header class="site-header">
        <div class="site-logo">U</div>
        <div>
            <h1>UniDemo — Campus Virtual</h1>
            <div class="site-subtitle">Plataforma de gestión académica</div>
        </div>
    </header>

    <div class="main-content">
        <div class="login-container">
            <div class="login-title">Iniciar sesión en su cuenta</div>

            {% if error %}
            <div class="error-msg">{{ error }}</div>
            {% endif %}

            <form method="POST" action="{{ url_for('login.login_submit') }}">
                <div class="form-group">
                    <label for="username">Nombre de usuario</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="btn">Acceder</button>
            </form>

            <div class="login-help">
                ¿Olvidó su nombre de usuario o contraseña?
            </div>
        </div>
    </div>

    <footer class="site-footer">
        UniDemo Campus Virtual — Plataforma educativa de demostración
    </footer>
</body>
</html>
