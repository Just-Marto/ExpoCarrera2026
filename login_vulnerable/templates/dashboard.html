<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniDemo — Panel del usuario</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body>
    <header class="site-header">
        <div class="site-logo">U</div>
        <div>
            <h1>UniDemo — Campus Virtual</h1>
            <div class="site-subtitle">Plataforma de gestión académica</div>
        </div>
    </header>

    <a href="{{ url_for('ctf.dashboard') }}" class="global-back-btn" aria-label="Volver a CyberQuest">←</a>

    <div class="main-content">
        <div class="dashboard">
            <div class="user-info">
                <div class="user-avatar">{{ username[0]|upper }}</div>
                <h1>Bienvenido/a, {{ username }}</h1>
                <p>Sesión iniciada correctamente.</p>
            </div>
            <p>Accediste al panel del Campus Virtual UniDemo.</p>
            <a href="{{ url_for('login.login_page') }}" class="btn-secondary">Cerrar sesión</a>
        </div>
    </div>

    <footer class="site-footer">
        UniDemo Campus Virtual — Plataforma educativa de demostración
    </footer>
</body>
</html>
