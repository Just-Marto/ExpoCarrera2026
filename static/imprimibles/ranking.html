<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ranking — CyberQuest</title>
    <style>
        @page { size: A4; margin: 15mm; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #222;
            max-width: 180mm;
            margin: 0 auto;
            padding: 10mm;
        }
        .header {
            text-align: center;
            margin-bottom: 8mm;
        }
        .header h1 {
            font-size: 32px;
            color: #0d1117;
        }
        .header p {
            font-size: 14px;
            color: #666;
            margin-top: 2mm;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 5mm;
        }
        th {
            background: #0d1117;
            color: white;
            padding: 4mm;
            font-size: 13px;
            text-align: left;
        }
        th:first-child { width: 10mm; text-align: center; border-radius: 6px 0 0 0; }
        th:last-child { border-radius: 0 6px 0 0; }
        td {
            padding: 5mm 4mm;
            border-bottom: 1px solid #ddd;
            font-size: 14px;
        }
        td:first-child { text-align: center; font-weight: 700; color: #666; }
        tr:nth-child(even) { background: #f9f9f9; }
        .trophy { font-size: 16px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🏆 Ranking CyberQuest</h1>

            <tr><td><span class="trophy">🥈</span></td><td></td><td></td><td></td></tr>

            <tr><td>6</td><td></td><td></td><td></td></tr>

            <tr><td>9</td><td></td><td></td><td></td></tr>
            <tr><td>10</td><td></td><td></td><td></td></tr>
            <tr><td>11</td><td></td><td></td><td></td></tr>
            <tr><td>12</td><td></td><td></td><td></td></tr>
            <tr><td>13</td><td></td><td></td><td></td></tr>
            <tr><td>14</td><td></td><td></td><td></td></tr>
            <tr><td>15</td><td></td><td></td><td></td></tr>

    </table>
</body>
</html>
